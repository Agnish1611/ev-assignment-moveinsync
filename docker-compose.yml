version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev-postgres
    environment:
      POSTGRES_DB: ev_fleet
      POSTGRES_USER: ev_admin
      POSTGRES_PASSWORD: ev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev_admin -d ev_fleet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
